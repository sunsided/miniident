[package]
name = "miniident"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85.0"
description = "Online identifiability and excitation diagnostics on top of minikalman: is the model identified, which parameters are not, and which input fixes it"
authors = ["Markus Mayer"]
license = "MIT OR Apache-2.0"
keywords = ["identification", "identifiability", "kalman-filter", "embedded", "no-std"]
categories = ["algorithms", "science::robotics", "embedded", "no-std::no-alloc"]
readme = "README.md"
repository = "https://github.com/sunsided/miniident"
documentation = "https://docs.rs/miniident"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[features]
default = ["libm"]
std = ["minikalman/std"]
libm = ["minikalman/libm"]
micromath = ["minikalman/micromath"]
fixed = ["minikalman/fixed"]

[dependencies]
minikalman = { version = "0.9", default-features = false }

[lints.rust]
missing_docs = "warn"
# Safe by default. If a crate needs unsafe, use "deny" here instead and scope
# #[expect(unsafe_code, reason = "...")] to the smallest item (forbid cannot be overridden).
unsafe_code = "forbid"
# High-assurance profile (docs: CONTRIBUTING.md).
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"
# High-assurance profile: no panics, no unchecked indexing, arithmetic or casts.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
missing_assert_message = "deny"
lossy_float_literal = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[[example]]
name = "rls-identifiability"
path = "examples/rls_identifiability.rs"

[[example]]
name = "greybox-sensitivity"
path = "examples/greybox_sensitivity.rs"

[dev-dependencies]
criterion = "0.8"
proptest = "1.12"

[[bench]]
name = "assess"
harness = false
