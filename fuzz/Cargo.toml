[package]
name = "miniident-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Separate workspace: cargo-fuzz needs nightly and must stay out of the root crate.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"

[dependencies.miniident]
path = ".."

# Copy of the root base lint table (a separate workspace cannot inherit it). The
# High-assurance deltas stay out: fuzz targets index and unwrap on purpose.
[lints.rust]
missing_docs = "warn"
# Safe by default. If a crate needs unsafe, use "deny" here instead and scope
# #[expect(unsafe_code, reason = "...")] to the smallest item (forbid cannot be overridden).
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[[bin]]
name = "assess"
path = "fuzz_targets/assess.rs"
test = false
doc = false
bench = false

[[bin]]
name = "eigen"
path = "fuzz_targets/eigen.rs"
test = false
doc = false
bench = false
